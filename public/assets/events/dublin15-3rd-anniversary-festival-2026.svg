  <text x="450" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#ffdf00">12PM–6PM</text>
  <text x="450" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#fff">SPORT IRELAND CAMPUS · INDOOR ARENA</text>
  <text x="450" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#fff">FUN · GAMES · PRIZES · AROUND 30 MATCHES</text>

  <g transform="translate(94 815)">
