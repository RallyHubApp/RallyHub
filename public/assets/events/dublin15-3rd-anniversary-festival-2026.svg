    <text x="356" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#078e48">REGISTRATION NOW OPEN · WHATSAPP TO REGISTER</text>
    <text x="356" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#07184c">089 407 6674</text>
  </g>

  <g transform="translate(715 930) rotate(-15)">
    <circle cx="0" cy="0" r="67" fill="#ffdf00" stroke="#fff" stroke-width="6"/>
    <g fill="#07184c"><circle cx="-24" cy="-23" r="7"/><circle cx="7" cy="-31" r="7"/><circle cx="30" cy="-8" r="7"/><circle cx="-31" cy="9" r="7"/><circle cx="3" cy="6" r="7"/><circle cx="27" cy="27" r="7"/><circle cx="-13" cy="34" r="7"/></g>
