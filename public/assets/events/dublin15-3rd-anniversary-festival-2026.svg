<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Dublin 15 Pickleball 3rd Anniversary Festival</title>
  <desc id="desc">Sunday 18 October 2026, 12pm to 6pm, Sport Ireland Campus Indoor Arena, with special guests PPA players Mikolaj Biedermann and Thaila Rodrigues. Register by WhatsApp on 089 407 6674.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04144e"/><stop offset="0.55" stop-color="#073b9c"/><stop offset="1" stop-color="#07184c"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ffdf00" stop-opacity=".35"/><stop offset="1" stop-color="#ffdf00" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter>
    <pattern id="mesh" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M0 22H44M22 0V44" stroke="#fff" stroke-opacity=".055" stroke-width="2"/></pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#mesh)"/>
  <circle cx="730" cy="260" r="430" fill="url(#glow)"/>
  <path d="M0 980 C190 900 330 1010 520 930 C690 860 790 900 900 850 L900 1200 L0 1200 Z" fill="#ffdf00" opacity=".95"/>
  <path d="M0 1015 C190 935 330 1045 520 965 C690 895 790 935 900 885" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5"/>

  <g transform="translate(75 62)">
    <circle cx="74" cy="74" r="65" fill="#fff" stroke="#ffdf00" stroke-width="9"/>
    <circle cx="74" cy="74" r="52" fill="#07184c"/>
    <g fill="#fff"><circle cx="50" cy="45" r="6"/><circle cx="78" cy="38" r="6"/><circle cx="102" cy="53" r="6"/><circle cx="47" cy="77" r="6"/><circle cx="84" cy="72" r="6"/><circle cx="109" cy="89" r="6"/><circle cx="66" cy="105" r="6"/></g>
    <text x="160" y="58" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#fff">DUBLIN 15</text>
    <text x="160" y="102" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffdf00">PICKLEBALL</text>
  </g>

  <g filter="url(#shadow)">
    <text x="450" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" font-style="italic" fill="#ffdf00" stroke="#07184c" stroke-width="10" paint-order="stroke">3RD</text>
    <text x="450" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#fff" stroke="#07184c" stroke-width="7" paint-order="stroke">ANNIVERSARY</text>
    <text x="450" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" font-style="italic" fill="#ffdf00">FESTIVAL</text>
  </g>

  <g transform="translate(80 485)">
    <rect width="740" height="78" rx="18" fill="#fff" opacity=".98"/>
    <text x="370" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#07184c">SUNDAY 18 OCTOBER 2026</text>
