<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RallyHub | Master logo review (staging)</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#f4f7f8;color:#0a2336}header,main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:8px}.note{background:#fff3d7;padding:14px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.panel{background:white;border:1px solid #d5dde1;border-radius:12px;overflow:hidden}.sample{height:210px;display:grid;place-items:center;padding:20px}.dark{background:#0a2336}.sample img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.meta{padding:16px;border-top:1px solid #d5dde1;overflow-wrap:anywhere}.missing{color:#a3291c;font-weight:700}.ok{color:#16703a;font-weight:700}code{font-size:13px}footer{padding:25px;text-align:center}</style><header><h1>RallyHub — master artwork review</h1><p class="note"><strong>Staging only.</strong> No logo is approved or deployed by this page. A missing original is shown as MISSING, never substituted with an older asset.</p></header><main><div id="grid" class="grid"></div></main><footer>Original source files only • No resizing or image processing • Approval required</footer><script>const assets=[['01 — Primary','rallyhub-master-01-horizontal.png',false],['02 — Reversed','rallyhub-master-02-reversed.png',true],['03 — Strapline','rallyhub-master-03-strapline.png',false],['04 — Compact','rallyhub-master-04-compact.png',false]];const grid=document.getElementById('grid');for(const [label,file,dark] of assets){const panel=document.createElement('section');panel.className='panel';const sample=document.createElement('div');sample.className='sample'+(dark?' dark':'');const meta=document.createElement('div');meta.className='meta';const heading=document.createElement('h2');heading.textContent=label;const name=document.createElement('code');name.textContent=file;const status=document.createElement('p');status.className='missing';status.textContent='MISSING — original master not yet ingested';meta.append(heading,name,status);panel.append(sample,meta);grid.append(panel);const img=new Image();img.onload=()=>{sample.append(img);status.className='ok';status.textContent=`FILE PRESENT — ${img.naturalWidth} × ${img.naturalHeight}px; NOT YET APPROVED`};img.onerror=()=>{sample.textContent='Original file unavailable';if(dark)sample.style.color='white'};img.alt=label;img.src='/assets/brand/master-review/'+file}</script></html>
