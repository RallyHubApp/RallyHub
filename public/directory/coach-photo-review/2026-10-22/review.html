<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RallyHub Coach Photo Review</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#10243b}main{max-width:750px;margin:auto;padding:18px}header{background:#0d2946;color:white;padding:16px;border-radius:12px}h1{font-size:22px;margin:0 0 6px}button,input{font:inherit}button{cursor:pointer;border:1px solid #bbc7d4;background:white;border-radius:8px;padding:9px 13px}button.primary{background:#0d2946;color:white}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.panel{background:white;border-radius:12px;padding:16px;margin-top:14px;border:1px solid #d8e0e9}.crop{width:min(100%,440px);aspect-ratio:1;margin:12px auto;background:#d7e1e8;overflow:hidden;position:relative;touch-action:none;cursor:grab;border-radius:10px}.crop img{position:absolute;max-width:none;pointer-events:none}.crop .placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px}.full{box-sizing:border-box;width:100%;padding:11px;border:1px solid #b7c3d1;border-radius:8px}label{display:block;margin:10px 0 4px;font-weight:600}.muted{color:#53677a;font-size:13px}#message{min-height:20px;font-size:13px;color:#294f78}.crop img{display:none}#zoom{flex:1}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.approved{color:#176a3b;font-weight:700}</style><main><header><h1>RallyHub · Coach Photo Review</h1><div>16 coaches · one card at a time · unpublished review</div></header><div class="panel"><div class="bar" style="justify-content:space-between"><button id="prev">← Previous</button><strong id="count"></strong><button id="next">Next →</button></div><h2 id="name"></h2><div class="muted" id="details"></div><label for="url">Facebook, Instagram, website or image link</label><input class="full" id="url" placeholder="Paste the source URL"><div class="bar"><button id="load">Try direct image</button><label style="margin:0;font-weight:400">Or choose saved photograph <input type="file" accept="image/*" id="file"></label></div><div class="muted">Social post links and blocked images need server-side staging first. A saved photo can be loaded directly.</div><div id="message"></div><div class="crop" id="stage"><div class="placeholder" id="placeholder">Photo preview</div><img id="image" alt="Coach photograph"></div><div class="bar"><span>Zoom</span><input type="range" id="zoom" min="100" max="450" value="100"><span id="zoomText">100%</span><button id="reset">Reset</button></div><div class="muted">Drag the photo to centre the coach and crop out other people.</div><label for="bio">Coach biography / corrections</label><textarea id="bio" class="full" rows="4" placeholder="Add or correct the coach biography"></textarea><div class="bar"><button id="saveCrop">Download cropped image</button><button id="stageUpload" class="primary" type="button">Open authenticated uploader for this coach</button><button id="keep">Keep for review</button><label style="margin:0"><input type="checkbox" id="approved"> Approve photo</label></div><div class="footer"><span id="status"></span><button class="primary" id="export">Export review decisions</button></div></div></main><script>
const people=[['Francie Fitzpatrick','Laois · RallyTime Pickle','https://images.squarespace-cdn.com/content/v1/672aabbeea1e167d8e463b82/64cb50d1-e5b3-4f37-b5d2-384b1f4bc467/FrancieFitzpatrick.jpg'],['Bobby Fitzpatrick','Laois · RallyTime Pickle','https://images.squarespace-cdn.com/content/v1/672aabbeea1e167d8e463b82/190affac-7ec7-4d9e-8524-460a0da718fd/BobbyFitzpatrick-crop.jpg'],['Michael McDaid','Donegal · Celtic Pickleball','/directory/coach-photo-review/2026-10-22/coach-unassigned-facebook-source.jpg'],['Colin Sheridan','Westmeath',''],['Howard Castillo','Dublin · Dinking Hub',''],['Debbie Brown','Dublin · Portmarnock',''],['Heather Campbell Kelly','Dublin',''],['Jordan O’Brien','Meath · Prism Pickleball',''],['Vincent Maloney','Kildare · North Kildare',''],['Cassandra Mooney','Westmeath · Multyfarnham',''],['Teo Ciuche','Galway',''],['Graham Mustoe','Northern Ireland',''],['Peter Hill','Cork · Pickled Sports',''],['Ken Edgeworth','EZ Court Hire','https://static.wixstatic.com/media/fb55d2_d1a90ac2178f4544aaddc9234fe87996~mv2.png/v1/fill/w_192,h_192,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Ken%20Pickleball%20Coach%20Promo.png'],['Mark Topping','EZ Court Hire','https://static.wixstatic.com/media/fb55d2_fc246fe88c7b4fa09288ca699559d52e~mv2.png/v1/fill/w_185,h_185,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Pickleball%20Coach%20Mark%20Promotional%20Portrait.png'],['Ava Battles','EZ Court Hire','https://static.wixstatic.com/media/fb55d2_20d18605f96d4ff68f4a59e8b6a35b58~mv2.png/v1/fill/w_185,h_185,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Ava%20Pickleball%20Coach%20Promo.png']];
const $=x=>document.getElementById(x),key='rallyhub-coach-review-v1';let records;try{records=JSON.parse(localStorage.getItem(key))}catch{};if(!Array.isArray(records)||records.length!==16)records=people.map(p=>({url:p[2],zoom:1,x:0,y:0,approved:false,kept:false,bio:''}));let index=2,w=0,h=0,drag=null,seq=0;const rec=()=>records[index];function persist(){try{localStorage.setItem(key,JSON.stringify(records))}catch{$('message').textContent='Browser storage unavailable. Export decisions before leaving.'}}function geom(){let s=$('stage').clientWidth,k=Math.max(s/w,s/h)*rec().zoom;return{s,W:w*k,H:h*k}}function paint(){if(!w)return;let p=rec(),g=geom();p.x=Math.max((g.s-g.W)/2,Math.min((g.W-g.s)/2,p.x));p.y=Math.max((g.s-g.H)/2,Math.min((g.H-g.s)/2,p.y));let im=$('image');im.style.width=g.W+'px';im.style.height=g.H+'px';im.style.left=(g.s-g.W)/2+p.x+'px';im.style.top=(g.s-g.H)/2+p.y+'px';$('zoomText').textContent=Math.round(p.zoom*100)+'%';}function load(){const n=++seq,p=rec();w=h=0;$('image').style.display='none';$('placeholder').style.display='grid';if(!p.url){$('message').textContent='Paste a link or choose a photograph.';return}let im=new Image();im.onload=()=>{if(n!==seq)return;w=im.naturalWidth;h=im.naturalHeight;$('image').src=im.src;$('image').style.display='block';$('placeholder').style.display='none';$('message').textContent='Drag and zoom to crop.';paint()};im.onerror=()=>{if(n===seq)$('message').textContent='This link cannot be displayed directly. Use a staged image or choose a saved photo.'};im.src=p.url}function show(){let p=rec();$('name').textContent=people[index][0];$('details').textContent=people[index][1];$('count').textContent=(index+1)+' of 16';$('url').value=p.url;$('zoom').value=Math.round(p.zoom*100);$('zoomText').textContent=Math.round(p.zoom*100)+'%';$('approved').checked=p.approved;$('bio').value=p.bio||'';$('status').textContent=p.approved?'✓ Approved':p.kept?'Saved for review':'Not yet reviewed';$('prev').disabled=index===0;$('next').disabled=index===15;load()}function move(i){persist();index=Math.max(0,Math.min(15,index+i));show()}$('bio').oninput=e=>{rec().bio=e.target.value;persist()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('load').onclick=()=>{Object.assign(rec(),{url:$('url').value.trim(),zoom:1,x:0,y:0,approved:false});persist();show()};$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{Object.assign(rec(),{url:reader.result,zoom:1,x:0,y:0,approved:false});show();$('message').textContent='Local photo loaded. Download crop and export decisions before leaving.'};reader.readAsDataURL(f)};$('zoom').oninput=e=>{rec().zoom=Number(e.target.value)/100;rec().approved=false;$('approved').checked=false;paint();persist()};$('reset').onclick=()=>{Object.assign(rec(),{zoom:1,x:0,y:0,approved:false});$('approved').checked=false;$('zoom').value=100;paint();persist()};$('approved').onchange=e=>{if(e.target.checked&&!w){e.target.checked=false;return}$('status').textContent=e.target.checked?'✓ Approved':'Not approved';rec().approved=e.target.checked;rec().kept=true;persist()};$('keep').onclick=()=>{rec().kept=true;persist();$('status').textContent='Saved for review'};let st=$('stage');st.onpointerdown=e=>{if(!w)return;drag=[e.clientX,e.clientY];st.setPointerCapture(e.pointerId)};st.onpointermove=e=>{if(!drag)return;let scale=st.clientWidth/st.getBoundingClientRect().width;rec().x+=(e.clientX-drag[0])*scale;rec().y+=(e.clientY-drag[1])*scale;drag=[e.clientX,e.clientY];rec().approved=false;$('approved').checked=false;paint();persist()};st.onpointerup=st.onpointercancel=()=>drag=null;function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('saveCrop').onclick=()=>{if(!w)return;let g=geom(),c=document.createElement('canvas');c.width=c.height=600;let ctx=c.getContext('2d'),scale=600/g.s;try{ctx.drawImage($('image'),((g.s-g.W)/2+rec().x)*scale,((g.s-g.H)/2+rec().y)*scale,g.W*scale,g.H*scale);c.toBlob(b=>{if(b)download(b,people[index][0].toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-crop.png')},'image/png')}catch(e){$('message').textContent='Cross-site image cannot be exported. Stage the source or choose a saved photo first.'}};$('export').onclick=()=>{let out=records.map((r,i)=>({coach:people[i][0],source:r.url.startsWith('data:')?'local-file-not-embedded':r.url,zoom:r.zoom,x:r.x,y:r.y,approved:r.approved,kept:r.kept,bio:r.bio||''}));download(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),'rallyhub-coach-review.json')};window.addEventListener('resize',paint);show();

$('stageUpload').onclick=()=>{const p=people[index];const slug=p[0].toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const params=new URLSearchParams({name:p[0],type:'coach',slug});window.open('/admin/media-review?'+params.toString(),'_blank','noopener');};
</script></html>
